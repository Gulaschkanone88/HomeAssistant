add_measurement:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: aquarium_log
    timestamp:
      example: "2026-10-24 18:30:00"
      selector:
        datetime:
    note:
      selector:
        text:
          multiline: true
    ph:
      selector:
        number:
          min: 0
          max: 14
          step: 0.1
          mode: box
    kh:
      selector:
        number:
          min: 0
          max: 50
          step: 1
          mode: box
          unit_of_measurement: "°dH"
    gh:
      selector:
        number:
          min: 0
          max: 50
          step: 1
          mode: box
          unit_of_measurement: "°dH"
    no2:
      selector:
        number:
          min: 0
          max: 10
          step: 0.05
          mode: box
          unit_of_measurement: "mg/l"
    no3:
      selector:
        number:
          min: 0
          max: 500
          step: 1
          mode: box
          unit_of_measurement: "mg/l"
    cl:
      selector:
        number:
          min: 0
          max: 10
          step: 0.01
          mode: box
          unit_of_measurement: "mg/l"
    nh4:
      selector:
        number:
          min: 0
          max: 20
          step: 0.05
          mode: box
          unit_of_measurement: "mg/l"
    po4:
      selector:
        number:
          min: 0
          max: 20
          step: 0.05
          mode: box
          unit_of_measurement: "mg/l"
    fe:
      selector:
        number:
          min: 0
          max: 10
          step: 0.01
          mode: box
          unit_of_measurement: "mg/l"
    cu:
      selector:
        number:
          min: 0
          max: 10
          step: 0.01
          mode: box
          unit_of_measurement: "mg/l"
    co2:
      selector:
        number:
          min: 0
          max: 200
          step: 1
          mode: box
          unit_of_measurement: "mg/l"
    o2:
      selector:
        number:
          min: 0
          max: 30
          step: 0.5
          mode: box
          unit_of_measurement: "mg/l"
    temperature:
      selector:
        number:
          min: 0
          max: 45
          step: 0.1
          mode: box
          unit_of_measurement: "°C"
    conductivity:
      selector:
        number:
          min: 0
          max: 5000
          step: 1
          mode: box
          unit_of_measurement: "µS/cm"

add_event:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: aquarium_log
    timestamp:
      example: "2026-10-24 18:30:00"
      selector:
        datetime:
    note:
      selector:
        text:
          multiline: true
    event_type:
      required: true
      default: water_change
      selector:
        select:
          translation_key: event_type
          options:
            - water_change
            - fertilizer
            - conditioner
            - filter
            - cleaning
            - plants
            - livestock
            - medication
            - technology
            - other
    volume_liters:
      selector:
        number:
          min: 0
          max: 10000
          step: 0.5
          mode: box
          unit_of_measurement: "l"
    percent:
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: box
          unit_of_measurement: "%"

update_item:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: aquarium_log
    timestamp:
      example: "2026-10-24 18:30:00"
      selector:
        datetime:
    note:
      selector:
        text:
          multiline: true
    item_id:
      required: true
      selector:
        text:
    values:
      example: '{"no3": 25}'
      selector:
        object:
    event_type:
      selector:
        select:
          translation_key: event_type
          options:
            - water_change
            - fertilizer
            - conditioner
            - filter
            - cleaning
            - plants
            - livestock
            - medication
            - technology
            - other
    volume_liters:
      selector:
        number:
          min: 0
          max: 10000
          step: 0.5
          mode: box
          unit_of_measurement: "l"
    percent:
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: box
          unit_of_measurement: "%"

delete_item:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: aquarium_log
    item_id:
      required: true
      selector:
        text:

export:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: aquarium_log
